version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - '*'
